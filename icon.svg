<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111a35"/>
      <stop offset="55%" stop-color="#080b16"/>
      <stop offset="100%" stop-color="#180d35"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#47f6ff"/>
      <stop offset="48%" stop-color="#8b72ff"/>
      <stop offset="100%" stop-color="#e45dff"/>
    </linearGradient>

    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8c8ff"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <rect
    x="20" y="20" width="472" height="472" rx="98"
    fill="none" stroke="url(#neon)" stroke-opacity=".42" stroke-width="3"
  />

  <circle cx="256" cy="242" r="158" fill="#6f5cff" opacity=".09"/>
  <circle cx="256" cy="242" r="127" fill="none"
          stroke="#6c8cff" stroke-opacity=".24" stroke-width="2"/>

  <g filter="url(#glow)" fill="none"
     stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round">

    <path d="M155 300
             C122 300 102 276 102 247
             C102 218 124 195 153 194
             C166 145 208 116 256 116
             C306 116 346 147 358 191
             C389 196 410 219 410 248
             C410 278 387 300 355 300
             Z"
          stroke-width="13"/>

    <path d="M157 245 L197 245
             M177 225 L177 265"
          stroke-width="12"/>

    <circle cx="325" cy="235" r="9" fill="#47f6ff" stroke="none"/>
    <circle cx="350" cy="257" r="9" fill="#e45dff" stroke="none"/>
  </g>

  <path d="M192 330 L320 330 L300 355 L212 355 Z"
        fill="url(#neon)" opacity=".95"/>

  <text x="256" y="408"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="51"
        font-weight="900"
        letter-spacing="4"
        fill="url(#core)">CV</text>

  <path d="M177 433 H335"
        stroke="url(#neon)"
        stroke-width="5"
        stroke-linecap="round"
        opacity=".85"/>
</svg>
